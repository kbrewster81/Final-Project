<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treact</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://pro.fontawesome.com/releases/v5.10.0/css/all.css"
        integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous" />
    <script src="script.js"></script>
</head>
 <body>
    <section id="landing">
      <nav>
        <div class="row nav__row">
          <div class="nav__logo">
            <div class="nav__container">
              <div class="nav__logo">
                <img class="nav__logo" src="./assets/logo-2.svg" alt="Logo"> 
                <span>Treact</span>
              </div>
              <div class="nav__links">
                <li><a href="#"class="nav__link">About</a></li>
                <li><a href="#"class="nav__link">Blog</a></li>
                <li><a href="#"class="nav__link">Pricing</a></li>
                <li><a href="#"class="nav__link">Contact Us</a></li>
                <li><a href="#"class="nav__link">Login</a></li>
                <li><a href="#"class="nav__link--primary">Sign Up</a></li>
              </div>
           </div>
           <button class="btn__menu" onclick="openMenu()">
             <i class="fas fa-bars"></i>
            </button>
      </nav>
       <div class="menu">    
        <div class="menu__backrop">
         <button class="btn__menu btn__menu--close" onclick="closeMenu()">
          <i class="fas fa-times"></i>
      </div>
    </div>
    </section>
       <header>
         <div class="header__container">
          <div class="row">
           <div class="header__description">
                <h1>
                 Beautiful React Templates 
                 <span class="purple"> for you.</span>
                </h1>
                 <p>Our templates are easy to setup, understand and customize. 
                   Fully modular components with a variety of pages and components.
                 </p>
                 <div class="header__email">
                  <input type="email" class="header__email--input" placeholder="Enter your email">
                  <button class="header__email--btn">Get Started</button>
                 </div>
                 <p class="header__customers--title">OUR TRUSTED CUSTOMERS</p>
                 <img class="header__image" src="./assets/customers-logo.png" alt="Customers Logo">
            </div>
             <figure class="header__img--wrapper">
              <img class="header__image" src="./assets/hero-screenshot.png" alt="Hero">
             </figure>
          </div>
         </div>
       </header>
 </body>
